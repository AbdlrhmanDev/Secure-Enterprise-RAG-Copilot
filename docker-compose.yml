x-app: &app
  build: {context: ., dockerfile: docker/Dockerfile}
  environment:
    DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
    QDRANT_URL: http://qdrant:6333
    REDIS_URL: redis://redis:6379
    INGEST_BACKEND: arq
    STORAGE_DIR: /data/uploads
    MODEL_CACHE_DIR: /data/models
    JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-before-deploying-anywhere}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
  volumes: [appdata:/data]
  depends_on:
    postgres: {condition: service_healthy}
    qdrant: {condition: service_started}
    redis: {condition: service_started}

services:
  api:
    <<: *app
    ports: ["${API_PORT:-8000}:8000"]
  worker:
    <<: *app
    command: ["arq", "app.ingestion.worker.WorkerSettings"]
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:latest
    volumes: [qdrantdata:/qdrant/storage]
  redis:
    image: redis:7

volumes: {appdata: {}, pgdata: {}, qdrantdata: {}}
