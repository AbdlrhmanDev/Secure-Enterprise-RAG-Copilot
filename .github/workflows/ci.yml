name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Lint
        run: uv run ruff check app scripts tests

      # The suite is fully offline: SQLite, in-memory Qdrant, a hashing embedder and the
      # extractive generator (see tests/conftest.py). No API key or model download is needed.
      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t secure-rag-copilot:ci .
