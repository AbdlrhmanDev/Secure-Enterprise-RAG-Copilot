[project]
name = "secure-rag-copilot"
version = "0.1.0"
description = "Secure enterprise RAG copilot: hybrid retrieval, reranking, grounded citations, document-level ACLs and an evaluation suite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "rank-bm25>=0.2.2",
    "numpy",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "arq>=0.26",
    "fpdf2>=2.8",
    "openai>=3.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
